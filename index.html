<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejas Anand | Career Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; }
        .mono { font-family: 'JetBrains Mono', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { background: #4f46e5; color: #ffffff; box-shadow: 0 0 20px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body class="min-h-screen pb-32">

    <nav class="p-6 border-b border-white/5 mb-12 glass sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="h-10 w-10 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg">TA</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">TEJAS ANAND <span class="text-indigo-400 text-xs font-mono ml-2">AUTO-PIPELINE v8.1</span></h1>
                    <p class="text-[10px] text-slate-400 font-mono tracking-widest uppercase mt-1">AI Data Engineer • Analytics Architect</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <input type="text" id="locationFilter" placeholder="Filter roles (e.g., Databricks, Pune)..." 
                       class="glass px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500 transition-all w-64 text-slate-200" oninput="renderDashboard()">
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 border-b border-white/5 pb-6">
            <div class="flex gap-2 p-1.5 bg-slate-900 rounded-2xl border border-white/5">
                <button onclick="switchSection('fulltime')" id="btn-fulltime" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 transition-all tab-active">
                    Full-Time (India)
                </button>
                <button onclick="switchSection('freelance')" id="btn-freelance" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 transition-all">
                    Freelance / Contract (Global)
                </button>
            </div>

            <div id="subFilters" class="flex gap-2 text-xs">
                <button onclick="setWorkplaceFilter('All')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/10 text-white border border-white/20 font-medium">All Setups</button>
                <button onclick="setWorkplaceFilter('Remote')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">Remote Only</button>
                <button onclick="setWorkplaceFilter('Hybrid')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">Hybrid</button>
                <button onclick="setWorkplaceFilter('On-site')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">On-site</button>
            </div>
        </div>

        <div id="feed" class="space-y-4">
            <div class="text-center py-24">
                <div class="inline-block animate-spin rounded-full h-6 w-6 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
                <p class="text-slate-500 mono text-xs tracking-widest">FETCHING CURATED OPPORTUNITIES...</p>
            </div>
        </div>
    </main>

    <script>
        let rawMasterJobs = [];
        let currentSection = 'fulltime';
        let currentWorkplaceFilter = 'All';

        async function initPipeline() {
            try {
                const targetUrl = `./jobs.json?t=${new Date().getTime()}`;
                const response = await fetch(targetUrl);
                rawMasterJobs = await response.json();
                renderDashboard();
            } catch (err) {
                console.error("Failed loading data.", err);
                document.getElementById('feed').innerHTML = `<div class="glass p-12 text-center text-red-400 text-sm">Action Pipeline Offline. Ensure agent.py has executed successfully.</div>`;
            }
        }

        function switchSection(section) {
            currentSection = section;
            document.getElementById('btn-fulltime').classList.toggle('tab-active', section === 'fulltime');
            document.getElementById('btn-freelance').classList.toggle('tab-active', section === 'freelance');
            document.getElementById('subFilters').style.opacity = section === 'fulltime' ? '1' : '0';
            document.getElementById('subFilters').style.pointerEvents = section === 'fulltime' ? 'auto' : 'none';
            renderDashboard();
        }

        function setWorkplaceFilter(filterValue) {
            currentWorkplaceFilter = filterValue;
            const buttons = document.querySelectorAll('.sub-filter');
            buttons.forEach(btn => {
                if(btn.textContent.includes(filterValue) || (filterValue === 'All' && btn.textContent.includes('All'))) {
                    btn.className = "sub-filter px-3 py-1.5 rounded-lg bg-white/10 text-white border border-white/20 font-medium";
                } else {
                    btn.className = "sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all";
                }
            });
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('feed');
            const searchText = document.getElementById('locationFilter').value.toLowerCase().trim();
            
            if (!rawMasterJobs || rawMasterJobs.length === 0) {
                container.innerHTML = `
                    <div class="glass p-20 rounded-3xl text-center text-slate-500 mono text-xs uppercase tracking-widest">
                        Pipeline index is empty. Waiting for next automated scraper cron execution.
                    </div>`;
                return;
            }

            let filtered = rawMasterJobs.filter(job => {
                const typeMatch = job.employment_type === (currentSection === 'fulltime' ? 'Full-Time' : 'Freelance/Contract');
                const workMatch = (currentSection === 'fulltime' && currentWorkplaceFilter !== 'All') ? job.workplace_type === currentWorkplaceFilter : true;
                const searchMatch = searchText === "" || 
                                  job.loc.toLowerCase().includes(searchText) || 
                                  job.title.toLowerCase().includes(searchText) ||
                                  job.desc.toLowerCase().includes(searchText) ||
                                  job.company.toLowerCase().includes(searchText);
                return typeMatch && workMatch && searchMatch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass p-20 rounded-3xl text-center text-slate-500 mono text-xs uppercase tracking-widest">
                        No active roles matching your precise filters right now.
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(job => {
                const badgeColor = job.workplace_type === 'Remote' ? 'text-emerald-400 bg-emerald-500/10' : 
                                  job.workplace_type === 'Hybrid' ? 'text-amber-400 bg-amber-500/10' : 'text-indigo-400 bg-indigo-500/10';

                return `
                    <div class="glass p-8 rounded-[1.5rem] transition-all hover:bg-white/[0.02] border border-white/[0.03] flex flex-col md:flex-row justify-between items-start gap-6">
                        <div class="flex-1">
                            <div class="flex flex-wrap items-center gap-2 mb-4">
                                <span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md bg-slate-900 border border-white/5 text-slate-400">${job.source}</span>
                                <span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md font-medium ${badgeColor}">${job.workplace_type}</span>
                                <span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md font-bold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 shadow-[0_0_10px_rgba(79,70,229,0.2)]">🎯 Match Score: ${job.tejas_score}%</span>
                            </div>
                            <h3 class="text-2xl font-bold tracking-tight mb-1 text-white">${job.title}</h3>
                            <p class="text-sm font-semibold text-indigo-400 mb-4">${job.company} <span class="text-slate-500 font-normal mx-1">•</span> <span class="text-slate-300 font-normal">${job.loc}</span></p>
                            <p class="text-sm text-slate-400 leading-relaxed max-w-4xl line-clamp-3">${job.desc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row md:flex-col justify-between items-end gap-4 w-full md:w-auto min-w-[180px] self-stretch border-t md:border-t-0 border-white/5 pt-4 md:pt-0">
                            <div class="text-left md:text-right hidden sm:block">
                                <p class="text-[10px] text-slate-500 mono uppercase tracking-wider">Discovered</p>
                                <p class="text-xs text-slate-300 font-medium tracking-tight mt-1">${job.timestamp}</p>
                            </div>
                            <a href="${job.url}" target="_blank" class="w-full text-center py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold uppercase text-[11px] tracking-widest transition-all shadow-lg shadow-indigo-600/20">Apply Now</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        initPipeline();
    </script>
</body>
</html>
