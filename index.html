<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligent Pipeline | Portal Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #030712; color: #f3f4f6; }
        .mono { font-family: 'JetBrains Mono', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.04); }
        .tab-active { background: #4f46e5; color: #ffffff; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body class="min-h-screen pb-32">

    <nav class="p-6 border-b border-white/5 mb-12 glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">Ω</div>
                <span class="text-xl font-bold tracking-tight">GLOBAL CAREER AGENT <span class="text-indigo-400 text-xs tracking-widest font-mono ml-2">v6.2</span></span>
            </div>
            <div class="flex items-center gap-4">
                <input type="text" id="locationFilter" placeholder="Search by Location (e.g. Remote, Bangalore)..." 
                       class="glass px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500 transition-all w-64 text-slate-200" oninput="renderDashboard()">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        
        <div class="glass p-8 rounded-[2rem] border border-white/5 mb-12 bg-gradient-to-b from-slate-900/40 to-slate-950/40">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-center">
                <div class="lg:col-span-1">
                    <h2 class="text-xl font-bold tracking-tight mb-2">Resume-Driven Alignment</h2>
                    <p class="text-sm text-slate-400 leading-relaxed">Paste or enter a raw profile snapshot. The engine runs semantic keyword indexing inside your browser to re-rank job arrays instantly.</p>
                </div>
                <div class="lg:col-span-2">
                    <textarea id="resumeInput" placeholder="Paste resume plain text profile here (Skills, Experience blocks, Frameworks)..." 
                              class="w-full h-24 p-4 glass rounded-xl text-xs font-mono focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-300 placeholder-slate-600" oninput="processResume()"></textarea>
                    <div id="resumeStatus" class="text-[11px] mono text-slate-500 mt-2 flex justify-between px-1">
                        <span>Parser Status: Standing By...</span>
                        <span id="matchCounter" class="text-indigo-400"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 mb-8 border-b border-white/5 pb-6">
            <div class="flex gap-2 p-1.5 bg-slate-950 rounded-2xl border border-white/5">
                <button onclick="switchSection('fulltime')" id="btn-fulltime" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 transition-all tab-active">
                    1. Full-Time Opportunities
                </button>
                <button onclick="switchSection('freelance')" id="btn-freelance" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 transition-all">
                    2. Freelance / Contract / WFA
                </button>
            </div>

            <div id="subFilters" class="flex gap-2 text-xs">
                <button onclick="setWorkplaceFilter('All')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/10 text-white border border-white/20 font-medium">All Setups</button>
                <button onclick="setWorkplaceFilter('Remote')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">Remote Only</button>
                <button onclick="setWorkplaceFilter('Hybrid')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">Hybrid</button>
                <button onclick="setWorkplaceFilter('On-site')" class="sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all">On-site</button>
            </div>
        </div>

        <div id="feed" class="space-y-4">
            <div class="text-center py-24">
                <div class="inline-block animate-spin rounded-full h-6 w-6 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
                <p class="text-slate-500 mono text-xs tracking-widest">CONNECTING TO PIPELINE SECTOR ARCHIVES...</p>
            </div>
        </div>
    </main>

    <script>
        let rawMasterJobs = [];
        let currentSection = 'fulltime'; // 'fulltime' or 'freelance'
        let currentWorkplaceFilter = 'All'; // 'All', 'Remote', 'Hybrid', 'On-site'
        let extractedResumeSkills = [];

        async function initPipeline() {
            try {
                // Fetches dynamic outputs built by the agent step pipeline
                const targetUrl = `./jobs.json?t=${new Date().getTime()}`;
                const response = await fetch(targetUrl);
                rawMasterJobs = await response.json();
                renderDashboard();
            } catch (err) {
                console.error("Pipeline source execution failed.", err);
                document.getElementById('feed').innerHTML = `
                    <div class="glass p-12 rounded-3xl text-center border-red-500/20">
                        <p class="text-sm text-red-400 font-medium mb-1">Local Data Target Offline</p>
                        <p class="text-xs text-slate-500 mono">Ensure jobs.json has been populated via pipeline actions execution.</p>
                    </div>`;
            }
        }

        function switchSection(section) {
            currentSection = section;
            document.getElementById('btn-fulltime').classList.toggle('tab-active', section === 'fulltime');
            document.getElementById('btn-freelance').classList.toggle('tab-active', section === 'freelance');
            
            // Toggle visibility for sub-filters safely based on active category
            const subFilterContainer = document.getElementById('subFilters');
            if (section === 'fulltime') {
                subFilterContainer.style.opacity = '1';
                subFilterContainer.style.pointerEvents = 'auto';
            } else {
                subFilterContainer.style.opacity = '0';
                subFilterContainer.style.pointerEvents = 'none';
            }
            
            renderDashboard();
        }

        function setWorkplaceFilter(filterValue) {
            currentWorkplaceFilter = filterValue;
            const buttons = document.querySelectorAll('.sub-filter');
            buttons.forEach(btn => {
                if(btn.textContent.includes(filterValue) || (filterValue === 'All' && btn.textContent.includes('All'))) {
                    btn.className = "sub-filter px-3 py-1.5 rounded-lg bg-white/10 text-white border border-white/20 font-medium";
                } else {
                    btn.className = "sub-filter px-3 py-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white transition-all";
                }
            });
            renderDashboard();
        }

        function processResume() {
            const text = document.getElementById('resumeInput').value.toLowerCase();
            if(!text.trim()) {
                extractedResumeSkills = [];
                document.getElementById('resumeStatus').innerText = "Parser Status: Clear / Standing By...";
                renderDashboard();
                return;
            }
            
            // Expanded lexicon targeting modern data workflows
            const coreLexicon = [
                'python', 'sql', 'aws', 'glue', 'pyspark', 'redshift', 'athena', 
                'dbt', 'databricks', 'spark', 'etl', 'snowflake', 'airflow', 
                'graphrag', 'lambda', 'step functions', 'lake formation'
            ];
            extractedResumeSkills = coreLexicon.filter(skill => text.includes(skill));
            
            document.getElementById('resumeStatus').innerText = `Parser Status: Extracted [${extractedResumeSkills.join(', ')}] tokens.`;
            renderDashboard();
        }

        function calculateResumeMatchScore(job) {
            if (extractedResumeSkills.length === 0) return null;
            let matches = 0;
            const targetBlob = (job.title + " " + job.desc).toLowerCase();
            
            extractedResumeSkills.forEach(skill => {
                if (targetBlob.includes(skill)) matches++;
            });
            
            return Math.round((matches / extractedResumeSkills.length) * 100);
        }

        function renderDashboard() {
            const container = document.getElementById('feed');
            const searchLocation = document.getElementById('locationFilter').value.toLowerCase().trim();
            
            // Map and calculate matching vectors dynamically
            let computedDataset = rawMasterJobs.map(job => {
                const score = calculateResumeMatchScore(job);
                return { ...job, resumeMatchScore: score };
            });

            // Float optimal profile matches straight to the top if resume parser contains data
            if(extractedResumeSkills.length > 0) {
                computedDataset.sort((a, b) => b.resumeMatchScore - a.resumeMatchScore);
            }

            // Enforce primary structural segment division tag filter
            let targetType = currentSection === 'fulltime' ? 'Full-Time' : 'Freelance/Contract';
            let filtered = computedDataset.filter(job => job.employment_type === targetType);

            // Filter on secondary workplace tags (Remote/Hybrid/Onsite)
            if(currentSection === 'fulltime' && currentWorkplaceFilter !== 'All') {
                filtered = filtered.filter(job => job.workplace_type === currentWorkplaceFilter);
            }

            // Location text query filter execution block
            if(searchLocation !== "") {
                filtered = filtered.filter(job => 
                    job.loc.toLowerCase().includes(searchLocation) || 
                    job.title.toLowerCase().includes(searchLocation) ||
                    job.company.toLowerCase().includes(searchLocation)
                );
            }

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass p-20 rounded-3xl text-center text-slate-500 mono text-xs uppercase tracking-widest">
                        Zero opportunities matching active metrics found.
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(job => {
                const badgeColor = job.workplace_type === 'Remote' ? 'text-emerald-400 bg-emerald-500/10' : 
                                  job.workplace_type === 'Hybrid' ? 'text-amber-400 bg-amber-500/10' : 'text-indigo-400 bg-indigo-500/10';
                
                const hasScore = job.resumeMatchScore !== null;

                return `
                    <div class="glass p-8 rounded-3xl transition-all hover:bg-white/[0.01] border border-white/[0.03] flex flex-col md:flex-row justify-between items-start gap-6">
                        <div class="flex-1">
                            <div class="flex flex-wrap items-center gap-2 mb-3">
                                <span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md bg-slate-950 border border-white/5 text-slate-400">${job.source}</span>
                                <span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md font-medium ${badgeColor}">${job.workplace_type}</span>
                                ${hasScore ? `<span class="text-[10px] font-mono tracking-wider uppercase px-2.5 py-1 rounded-md font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">🎯 ${job.resumeMatchScore}% Match</span>` : ''}
                            </div>
                            <h3 class="text-xl font-bold tracking-tight mb-1 text-white">${job.title}</h3>
                            <p class="text-sm font-medium text-indigo-400/90 mb-3">${job.company} — <span class="text-slate-400 font-normal text-xs">${job.loc}</span></p>
                            <p class="text-xs text-slate-400 leading-relaxed max-w-4xl">${job.desc}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row md:flex-col justify-between items-end gap-4 w-full md:w-auto min-w-[180px] self-stretch border-t md:border-t-0 border-white/5 pt-4 md:pt-0">
                            <div class="text-left md:text-right hidden sm:block">
                                <p class="text-[10px] text-slate-600 mono uppercase tracking-wider">Synced</p>
                                <p class="text-xs text-slate-400 font-medium tracking-tight mt-0.5">${job.timestamp}</p>
                            </div>
                            <a href="${job.url}" target="_blank" class="w-full text-center py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold uppercase text-xs tracking-widest transition-all shadow-md shadow-indigo-600/10">Apply Position</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Run pipeline on boot
        initPipeline();
    </script>
</body>
</html>
